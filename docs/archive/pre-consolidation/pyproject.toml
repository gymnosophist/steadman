[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steadman"
version = "1.0.0"
description = "Pharr-style classical text reader with facing vocabulary — Latin and Ancient Greek"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Alex Leedom", email = "amleedom@gmail.com" },
]
keywords = ["latin", "greek", "classical", "nlp", "philology", "pedagogy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    # HTTP — fetching texts and dictionary entries from remote APIs
    "requests>=2.28",

    # PDF generation — no Word/LibreOffice dependency
    "reportlab>=4.0",

    # OS-appropriate cache and data directories
    # e.g. ~/.cache/steadman on Linux, ~/Library/Caches/steadman on macOS
    "platformdirs>=3.0",
]

[project.optional-dependencies]
# NLP dependencies are optional so the CLI stays usable even without them.
# Without CLTK, lemmatisation is skipped (raw word forms are used instead).
nlp = [
    "cltk>=1.1",
]

# Development tools
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",         # fast linter + formatter
    "mypy",         # type checking
]

[project.scripts]
# After `pip install .`, users can run `steadman` directly from the terminal.
steadman = "steadman.__main__:main"

[project.urls]
Repository = "https://github.com/amleedom/steadman"

[tool.hatch.build.targets.wheel]
packages = ["steadman"]

# ---------------------------------------------------------------------------
# Ruff (linter) configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # line length handled by formatter

# ---------------------------------------------------------------------------
# Pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
