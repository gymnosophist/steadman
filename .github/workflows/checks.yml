name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]' ruff build
      - run: ruff check steadman tests scripts
      - run: ruff format --check steadman tests scripts
      - run: python -m pytest -q
      - run: python scripts/inventory_artifacts.py --check
      - run: python -m build
