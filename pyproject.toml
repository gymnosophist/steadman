[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steadman"
version = "0.1.0"
description = "Add English vocabulary to ancient texts: Pharr-style Latin and Greek readers as PDFs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gymnosophist" }]
dependencies = [
    "requests>=2.28",
    "reportlab>=4.0",
    "platformdirs>=3.0",
]

[project.optional-dependencies]
# Lemmatisation (Latin and Greek BackoffLemmatizers)
nlp = ["cltk>=1.1,<2"]
# Primary Latin lexicon / morphological analyser (not on PyPI)
latin = ["whitakers_words @ git+https://github.com/blagae/whitakers_words.git@92eb56f188ec9dadecca01ca34d3c9fd13d746da"]
dev = ["pytest"]

[project.scripts]
steadman = "steadman.__main__:main"

[project.urls]
Repository = "https://github.com/gymnosophist/steadman"

[tool.hatch.build.targets.wheel]
packages = ["steadman"]

[tool.hatch.build.targets.sdist]
only-include = ["steadman", "tests", "scripts", "docs/AUDIT.md", "docs/artifact-manifest.json", "README.md", "THIRD_PARTY_NOTICES.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.metadata]
allow-direct-references = true
